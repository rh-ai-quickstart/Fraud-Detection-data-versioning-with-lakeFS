# OpenShift-specific values for fraud-detection chart
# This file overrides values.yaml for OpenShift deployments

# Global settings
global:
  openshift: true

# Images for Jobs / initContainers — avoid Docker Hub (rate limits on OpenShift)
jobImages:
  # oc + curl available
  cli: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
  # python for boto3 bucket bootstrap / pipeline upload
  python: registry.redhat.io/ubi9/python-311:latest
  # lightweight shell for PVC waits
  shell: registry.redhat.io/ubi9/ubi-minimal:latest

# OpenShift-specific features
openshift:
  enabled: true
  routes:
    enabled: true
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

# RBAC configuration
rbac:
  create: true
  rayWorkloads:
    enabled: true

# ServiceAccount configuration
serviceAccount:
  create: true
  name: "demo-setup"

fullnameOverride: "lakefs"

# aws-compatible-storage (S4-backed) from ai-architecture-charts — values key is "s4" via Chart alias
# Runtime: quay.io/rh-aiservices-bu/s4 — S3 API :7480, Web UI :5000
# Chart: https://github.com/rh-ai-quickstart/ai-architecture-charts/tree/main/aws-compatible-storage
s4:
  enabled: true
  fullnameOverride: s4
  image:
    repository: quay.io/rh-aiservices-bu/s4
    tag: "0.3.2"
    pullPolicy: IfNotPresent
  s3:
    accessKeyId: s4admin
    secretAccessKey: s4secret
  auth:
    enabled: true
    username: admin
    password: changeme
  route:
    enabled: true
    s3Api:
      enabled: false
  storage:
    data:
      size: 10Gi

# Parent chart Job: create S3 buckets (not part of the aws-compatible-storage subchart)
s4Buckets:
  create: true
  names:
    - pipeline-artifacts
    - my-storage
    - quickstart
  serviceAccountName: demo-setup

# lakeFS configuration
lakefs:
  replicaCount: 1

  secret:
    name: ""
    secret_key: something
    secret_access_key: simple
    endpoint: http://lakefs

    repo_name: my-storage
    default_region: us-east-1
    notebook_access_key_id: something
    notebook_secret_access_key: simple
  
  image:
    repository: treeverse/lakefs
    tag: "1.73.0"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8000
  
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  
  podAnnotations: {}
  
  config:
    logging:
      format: json
      level: WARN
      output: "-"
    
    database:
      type: local
      # For external PostgreSQL:
      # type: postgres
      # postgres:
      #   connectionString: "postgres://user:pass@host:5432/lakefs"
    
    auth:
      encrypt:
        # Generate a random secret_key with: openssl rand -hex 32
        secretKey: "10a718b3f285d89c36e9864494cdd1507f3bc85b342df24736ea81f9a1134bcc"
    
    blockstore:
      type: s3
      s3:
        endpoint: http://s4:7480
        forcePathStyle: true
        discoverBucketRegion: false
        region: us-east-1
  
  # lakeFS admin credentials for initial setup and API access
  adminCredentials:
    username: admin
    accessKeyId: something
    secretAccessKey: simple

# Repository creation configuration
repositories:
  create: true
  repos:
    - name: quickstart
      storageNamespace: s3://quickstart/
      defaultBranch: main
      sampleData: true
    - name: my-storage
      storageNamespace: s3://my-storage/
      defaultBranch: main
      sampleData: false

# Notebook configuration - OpenShift overrides
notebook:
  enabled: true  # Enable notebook for OpenShift AI

  # Username for the notebook
  username: "admin"
  
  # Notebook image configuration (Red Hat UBI Python - always available)
  # image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/tensorflow:2025.2
  image:
    repository: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/tensorflow
    tag: "2025.2"
    pullPolicy: IfNotPresent
    name: "Python 3.12"  # Display name for the image
  
  # Resource configuration
  resources:
    size: "Small"  # Display name for size selection
    limits:
      cpu: "2"
      memory: "8Gi"
    requests:
      cpu: "1"
      memory: "4Gi"
  
  # Storage configuration
  storage:
    size: 20Gi
    storageClassName: ""  # Use default storage class if not specified
  
  # Shared memory for large model training
  shm:
    enabled: true
    size: 2Gi
  
  # lakeFS connection information
  lakefs:
    url: "http://lakefs"
  
  # S4 (S3 API) connection for OpenShift AI data connection Secret
  s4:
    endpoint: "http://s4:7480"
    defaultBucket: "pipeline-artifacts"
    region: us-east-1
  
  # OpenShift AI specific settings
  openshiftAI:
    dataConnections:
      enabled: true  # Create OpenShift AI data connections for S4 and lakeFS
  
  # Git sync to automatically clone notebooks
  gitSync:
    enabled: true  # Automatically clone notebooks from repository
    repo: "https://github.com/rh-ai-quickstart/Fraud-Detection-data-versioning-with-lakeFS.git"
    branch: "main"
    image: "alpine/git:latest"

# Notebook Studio UI (Streamlit) configuration
ui:
  enabled: true
  replicaCount: 1
  waitForLakeFS: true
  automountServiceAccountToken: true

  # Image is built in CI/CD and pushed to the registry below.
  image:
    repository: quay.io/rh-ai-quickstart/fraud-detection-studio
    tag: latest
    pullPolicy: Always

  # Optional pull secret if the registry repository is private.
  imagePullSecrets: []

  service:
    type: ClusterIP
    port: 8501

  route:
    enabled: true

  lakefs:
    url: "http://lakefs"

  s4:
    endpoint: "http://s4:7480"

  inference:
    # Defaults to in-cluster KServe/OpenShift AI predictor for the release namespace.
    url: ""
    serviceName: fraud-detection-predictor
    modelName: fraud-detection
    port: 80

  modelRegistry:
    # Existing OpenShift AI Model Registry on this cluster.
    # Use the Route: NetworkPolicies often block cross-ns svc:8443 traffic.
    url: "https://ryans-model-registry-rest.apps.ai-dev02.kni.syseng.devcluster.openshift.com"
    name: ryans-model-registry

  deploy:
    namespace: ""
    dataConnectionKey: my-storage
    serviceAccountName: lakefs-notebook

  servingRuntime:
    enabled: true
    name: kserve-ovms
    image: registry.redhat.io/rhoai/odh-openvino-model-server-rhel9@sha256:1ab58519c50e2c3a9ebf0fee6d0708b1b5a0ae972aefcc722d87b2f62239a033

  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

  podAnnotations: {}
  extraEnv: []

# Distributed workloads (CodeFlare / Ray / Kueue)
distributedWorkloads:
  kueue:
    labelNamespace: true
    waitForLocalQueue: true
    maxRetries: 30
    image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest

# PostgreSQL configuration for Model Registry
postgres:
  enabled: false # disabled here; the fraud-detection-admin chart now deploys PostgreSQL alongside the Model Registry in rhoai-model-registries.
  name: postgres
  # Note: This is the namespace for the model registry. It is not the same as the namespace for the fraud detection project.
  # namespace: rhoai-model-registries  # Target namespace for PostgreSQL deployment
  namespace: fraud-detection
  
  # Image configuration
  image:
    repository: docker.io/postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  
  # ImageStream configuration (OpenShift only)
  imageName: postgres
  imageTag: "16-alpine"
  
  # Database credentials
  user: postgres_user
  password: postgres_password
  database: model_registry
  
  # Service configuration
  port: 5432
  
  # Optional SSL mode for connections (disable, allow, prefer, require, verify-ca, verify-full)
  # sslMode: prefer
  
  # Persistence configuration
  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClassName: ""  # Use default storage class
  
  # Resource limits
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi


# Data Science Pipelines Application configuration
dataSciencePipelines:
  enabled: true
  name: dspa
  enableSamplePipeline: false
  # Upload the fraud-detection lakeFS pipeline after the DSPA is ready (post-install hook)
  uploadPipeline: true
  uploadPipelineUrl: "https://raw.githubusercontent.com/rh-ai-quickstart/Fraud-Detection-data-versioning-with-lakeFS/main/demo/pipelines/7_get_data_train_upload_lakefs.yaml"
  uploadPipelineName: "7-get-data-train-upload-lakefs"
  database:
    name: mlpipeline
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  objectStorage:
    bucket: pipeline-artifacts
    # DSPA operator probes object storage from outside the release namespace — use FQDN
    host: s4.fraud-detection.svc.cluster.local
    port: "7480"
    scheme: http
    s3CredentialsSecret:
      secretName: pipeline-artifacts
      accessKey: AWS_ACCESS_KEY_ID
      secretKey: AWS_SECRET_ACCESS_KEY

# Model Registry configuration
modelRegistry: # disabled here; Studio uses ui.modelRegistry against an existing OpenShift AI registry.
  enabled: false
  createService: false
  name: ryans-model-registry
  namespace: rhoai-model-registries