# fraud-detection-admin
# Self-contained chart that deploys PostgreSQL + Model Registry in the
# rhoai-model-registries namespace.  Requires cluster-admin privileges.
# Install independently of the main fraud-detection chart.

# ── PostgreSQL (deployed alongside the Model Registry) ─────────────────
postgres:
  enabled: true
  name: model-registry-db

  image:
    repository: docker.io/postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  # OpenShift ImageStream (used when openshift.enabled=true)
  imageName: postgres
  imageTag: "16-alpine"

  # Database credentials
  user: postgres_user
  password: postgres_password
  database: model_registry
  port: 5432

  # Persistence
  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClassName: ""   # Uses default storage class

  # Resources
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# ── OpenShift toggle (set to true when deploying on OpenShift) ─────────
openshift:
  enabled: true

# ── Model Registry (OpenShift AI / RHODS) ──────────────────────────────
modelRegistry:
  # Reuse the existing OpenShift AI Model Registry on this cluster.
  # Set enabled: true only if you need the chart to create a new ModelRegistry CR.
  enabled: false
  # Grant RBAC for access.projects/users even when enabled=false (existing registry).
  grantAccess: true
  name: ryans-model-registry
  namespace: rhoai-model-registries
  grpcPort: 9090
  restPort: 8080

  # Users / groups / projects that should access the registry.
  # Project entries bind system:serviceaccounts:<project> to registry-user-<name>.
  access:
    users: []
    groups: []
    projects:
      - fraud-detection

  # Post-install RBAC setup Job settings
  rbacSetup:
    image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
    maxRetries: 30          # 30 × 10 s = 5 min max wait
    backoffLimit: 5

# ── DataScienceCluster patch hook ──────────────────────────────────────
dataScienceCluster:
  patchEnabled: true
  name: default-dsc
  # Legacy alias kept for compatibility with earlier values files.
  managementState: Managed
  image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
  maxRetries: 30
  backoffLimit: 3
  components:
    modelregistry:
      enabled: true
      managementState: Managed
    codeflare:
      enabled: true
      managementState: Managed
    ray:
      enabled: true
      managementState: Managed
    kueue:
      enabled: true
      # OpenShift AI 2.25+ expects the external Red Hat Kueue operator (Unmanaged).
      # Use Managed only on older releases that still ship embedded Kueue.
      managementState: Unmanaged
  distributedWorkloads:
    maxRetries: 60
