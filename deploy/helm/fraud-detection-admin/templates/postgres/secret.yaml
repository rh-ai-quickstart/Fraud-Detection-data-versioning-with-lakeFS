{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fraud-detection-admin.postgres.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "fraud-detection-admin.postgres.name" . }}
    {{- include "fraud-detection-admin.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-name: {{ .Values.postgres.database | quote }}
  database-user: {{ .Values.postgres.user | quote }}
  database-password: {{ .Values.postgres.password | quote }}
{{- end }}
