{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fraud-detection-admin.postgres.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "fraud-detection-admin.postgres.name" . }}
    {{- include "fraud-detection-admin.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.postgres.port | default 5432 }}
      targetPort: postgres
      protocol: TCP
  selector:
    app: {{ include "fraud-detection-admin.postgres.name" . }}
{{- end }}
