{{- if and .Values.postgres.enabled ((.Values.openshift).enabled | default false) }}
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: {{ .Values.postgres.imageName | default "postgres" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "fraud-detection-admin.postgres.name" . }}
    {{- include "fraud-detection-admin.labels" . | nindent 4 }}
spec:
  lookupPolicy:
    local: false
  tags:
    - name: {{ .Values.postgres.imageTag | default "latest" }}
      from:
        kind: DockerImage
        name: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
      importPolicy:
        scheduled: true
      referencePolicy:
        type: Source
{{- end }}
