{{- if .Values.dataScienceCluster.patchEnabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fraud-detection-admin.fullname" . }}-patch-dsc
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "fraud-detection-admin.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "fraud-detection-admin.fullname" . }}-patch-dsc
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "fraud-detection-admin.labels" . | nindent 4 }}
rules:
  - apiGroups: ["datasciencecluster.opendatahub.io"]
    resources: ["datascienceclusters"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "fraud-detection-admin.fullname" . }}-patch-dsc
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "fraud-detection-admin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "fraud-detection-admin.fullname" . }}-patch-dsc
subjects:
  - kind: ServiceAccount
    name: {{ include "fraud-detection-admin.fullname" . }}-patch-dsc
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fraud-detection-admin.fullname" . }}-patch-dsc
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "fraud-detection-admin.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.dataScienceCluster.backoffLimit | default 3 }}
  template:
    metadata:
      labels:
        {{- include "fraud-detection-admin.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "fraud-detection-admin.fullname" . }}-patch-dsc
      restartPolicy: OnFailure
      containers:
        - name: patch-dsc
          image: {{ .Values.dataScienceCluster.image | default "image-registry.openshift-image-registry.svc:5000/openshift/cli:latest" }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              DSC="{{ .Values.dataScienceCluster.name }}"
              echo "Patching DataScienceCluster '${DSC}'..."

              retries=0
              max_retries={{ .Values.dataScienceCluster.maxRetries | default 30 }}
              until oc get datasciencecluster "${DSC}" &>/dev/null || [ "${retries}" -eq "${max_retries}" ]; do
                echo "Waiting for DataScienceCluster '${DSC}' to exist... (${retries}/${max_retries})"
                sleep 5
                retries=$((retries + 1))
              done

              if [ "${retries}" -eq "${max_retries}" ]; then
                echo "ERROR: DataScienceCluster '${DSC}' not found after ${max_retries} attempts"
                exit 1
              fi

              PATCH='{"spec":{"components":{'
              {{- $components := .Values.dataScienceCluster.components }}
              {{- if $components.modelregistry.enabled }}
              PATCH+='"modelregistry":{"managementState":"{{ $components.modelregistry.managementState }}"},'
              {{- end }}
              {{- if $components.codeflare.enabled }}
              PATCH+='"codeflare":{"managementState":"{{ $components.codeflare.managementState }}"},'
              {{- end }}
              {{- if $components.ray.enabled }}
              PATCH+='"ray":{"managementState":"{{ $components.ray.managementState }}"},'
              {{- end }}
              {{- if $components.kueue.enabled }}
              PATCH+='"kueue":{"managementState":"{{ $components.kueue.managementState }}"},'
              {{- end }}
              PATCH="${PATCH%,}"  # trim trailing comma
              PATCH+='}}}'

              echo "Applying merge patch: ${PATCH}"
              oc patch datasciencecluster "${DSC}" --type=merge -p "${PATCH}"

              echo "Successfully patched DataScienceCluster '${DSC}'"
              echo "Configured components:"
              {{- if $components.modelregistry.enabled }}
              echo "  modelregistry -> {{ $components.modelregistry.managementState }}"
              {{- end }}
              {{- if $components.codeflare.enabled }}
              echo "  codeflare -> {{ $components.codeflare.managementState }}"
              {{- end }}
              {{- if $components.ray.enabled }}
              echo "  ray -> {{ $components.ray.managementState }}"
              {{- end }}
              {{- if $components.kueue.enabled }}
              echo "  kueue -> {{ $components.kueue.managementState }}"
              {{- end }}

              echo "Waiting for Ray API (ray.io/rayclusters) to become available..."
              operator_retries=0
              operator_max_retries={{ .Values.dataScienceCluster.distributedWorkloads.maxRetries | default 60 }}
              until oc api-resources --api-group=ray.io 2>/dev/null | grep -q rayclusters; do
                if [ "${operator_retries}" -ge "${operator_max_retries}" ]; then
                  echo "WARNING: Timed out waiting for Ray API registration. Check:"
                  echo "  oc api-resources --api-group=ray.io"
                  echo "  oc get pods -n redhat-ods-applications | egrep 'kuberay|codeflare|kueue'"
                  exit 0
                fi
                echo "Waiting for ray.io API... (${operator_retries}/${operator_max_retries})"
                sleep 10
                operator_retries=$((operator_retries + 1))
              done
              echo "Ray API is registered on the cluster."
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
{{- end }}
